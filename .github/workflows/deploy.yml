# Deploy the static PWA to GitHub Pages.
#
# No compilation is needed. package-site selects the runtime HTML, scripts,
# styles and assets into dist/site; quality tests that package before deploy.
# Development tools, diagnostics and local data are excluded.
#
# Two details that matter:
#   - `.nojekyll` (repo root) opts out of Jekyll, which would otherwise process
#     every file and drop anything starting with `_` or `.`.
#   - All paths in the app are RELATIVE (manifest start_url/scope, the service
#     worker registration, every href), so it works unchanged from the
#     `/smart-invoice-pro/` sub-path a project Pages site is served from.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write the Pages deployment, mint the OIDC token
# Pages uses to verify the deploy came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. `cancel-in-progress: false` keeps a queued release
# from being killed halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Static and browser regressions must pass before deployment.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Run static and browser tests
        run: npm run test:all
        env:
          E2E_BROWSER: ${{ steps.chrome.outputs.chrome-path }}

      - name: Test packaged site from a subdirectory
        run: npm run test:staging
        env:
          E2E_BROWSER: ${{ steps.chrome.outputs.chrome-path }}

      - name: Audit dependencies
        run: npm audit --omit=dev

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package application
        run: npm run package:site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it is not already. Without this the first run fails
          # with a bare "Get Pages site failed — Not Found" that says nothing
          # about the real cause.
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the same application-only package tested by quality.
          path: dist/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
