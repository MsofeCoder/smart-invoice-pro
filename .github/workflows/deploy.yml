# Deploy the static PWA to GitHub Pages.
#
# No compilation is needed. package-site selects the runtime HTML, scripts,
# styles and assets into dist/site; quality tests that package before deploy.
# Development tools, diagnostics and local data are excluded.
#
# Two details that matter:
#   - `.nojekyll` (repo root) opts out of Jekyll, which would otherwise process
#     every file and drop anything starting with `_` or `.`.
#   - All paths in the app are RELATIVE (manifest start_url/scope, the service
#     worker registration, every href), so it works unchanged from the
#     `/smart-invoice-pro/` sub-path a project Pages site is served from.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feature/client-monitoring]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write the Pages deployment, mint the OIDC token
# Pages uses to verify the deploy came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. `cancel-in-progress: false` keeps a queued release
# from being killed halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Static and browser regressions must pass before deployment.
  quality:
    # Pin the test image: Ubuntu 24's user-namespace policy can prevent
    # Chrome for Testing from starting. Keep Chrome sandboxing enabled.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled cloud SDK
        run: npm run build:cloud-sdk && git diff --exit-code -- libs/supabase.js libs/supabase-licenses.txt libs/SUPABASE-LICENSE

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Run static and browser tests
        run: npm run test:all
        env:
          E2E_BROWSER: ${{ steps.chrome.outputs.chrome-path }}

      - name: Test packaged site from a subdirectory
        run: npm run test:staging
        env:
          E2E_BROWSER: ${{ steps.chrome.outputs.chrome-path }}

      - name: Audit dependencies
        run: npm audit --omit=dev

  backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Start disposable database and authentication
        run: supabase start -x realtime,storage-api,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor,mailpit -o json > .ci-monitoring-backend.log
      - name: Verify real tenant isolation and owner MFA
        run: npm run test:monitoring:backend
      - name: Check database security
        run: supabase db advisors --local --type security --fail-on warn
      - name: Test consent, offline retry and real authenticator verification
        run: npm run test:monitoring:online
        env:
          E2E_BROWSER: ${{ steps.chrome.outputs.chrome-path }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, backend]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package application
        run: npm run package:site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it is not already. Without this the first run fails
          # with a bare "Get Pages site failed — Not Found" that says nothing
          # about the real cause.
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the same application-only package tested by quality.
          path: dist/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
